# NOTE: This config is used ONLY in Docker Compose (frontend container).
# On Vercel, nginx does not run — frontend calls backend directly via
# REACT_APP_API_BASE_URL env var. The /api/ proxy block below is
# only active when running docker-compose up.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Docker Compose only: proxies /api/ to backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}