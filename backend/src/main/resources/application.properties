# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL (Neon / local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_tracking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis (local or Upstash)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL:false}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:60000}
# WebSocket
spring.websocket.max-text-message-size=8192
spring.websocket.max-binary-message-size=8192

# CORS (comma-separated origins: Vercel URL + localhost)
app.cors.allowed-origins=${SPRING_MVC_CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.mvc.cors.allowed-origins=${SPRING_MVC_CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.mvc.cors.allowed-methods=${SPRING_MVC_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
spring.mvc.cors.allowed-headers=${SPRING_MVC_CORS_ALLOWED_HEADERS:*}

# Logging
logging.level.com.ordertracking=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web.socket=${LOG_LEVEL_WS:INFO}

# JWT
jwt.secret=${JWT_SECRET:replaceWithAtLeast32CharSecret}
jwt.expiration=${JWT_EXPIRATION:86400000}
